services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labelmod
      POSTGRES_USER: labelmod
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD لازم است}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelmod -d labelmod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
