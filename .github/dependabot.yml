# Dependabot — به‌روزرسانی خودکار وابستگی‌ها
#
# اکشن‌های GitHub به SHA کامل پین شده‌اند (بند ۵ SECURITY.md). پین بدون
# نگهداری، خودش یک بدهی امنیتی می‌شود: نسخه قفل‌شده وصله‌های بعدی را
# نمی‌گیرد. Dependabot این تناقض را حل می‌کند — SHA را به‌روز نگه می‌دارد
# و هر تغییر از مسیر PR و تست‌های مالی رد می‌شود، نه مستقیم روی main.
#
# ورودی npm هم‌زمان با ساخت apps/api اضافه شد. تعداد کم وابستگی خودش
# یک کنترل امنیتی است — ولی همان تعداد کم هم باید وصله بگیرد.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "امنیت"
    labels:
      - dependencies
      - security

  # وابستگی‌های Node — Workspace ریشه، تا هر دو apps/ دیده شوند
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "امنیت"
    labels:
      - dependencies
      - security
    # به‌روزرسانی امنیتی جدا از به‌روزرسانی معمول می‌آید، پس PR وصله
    # امنیتی پشت PRهای نسخه معمولی صف نمی‌کشد.
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      types:
        patterns:
          - "@types/*"
