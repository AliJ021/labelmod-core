# ⚠️ تشخیص موقت — PR #106، ناپایداری webkit-dark-375. پیش از پذیرش نهایی حذف می‌شود.
#
# هیچ‌کدام از این Jobها معیار پذیرش نیستند و retry ندارند (retries: 0 در پیکربندی)؛
# هر شکست دیده می‌شود. پرسش‌ها:
#   targeted  — آیا دو آزمون شکست‌خورده (و قفل/خروج تاریخی) در انزوا و با تکرار هم می‌شکنند؟
#   project   — آیا کل پروژهٔ webkit-dark-375 به‌تنهایی ناپایدار است؟
#   shard4    — نرخ شکست همان ترکیب Shard ۴ با ۴ worker (دو اجرای مستقل)؟
#   serial    — همان Shard ۴ با یک worker: اگر پاک بماند، فشار هم‌زمانی مظنون است.
name: تشخیص موقت webkit-dark-375

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: DIAGNOSTIC webkit-dark-375 — ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: targeted
            args: --project=webkit-dark-375 --grep "split payment preserves|cash refund explicitly selects|header lock and logout" --repeat-each=20
          - mode: project
            args: --project=webkit-dark-375 --repeat-each=3
          - mode: shard4-a
            args: --shard=4/4
          - mode: shard4-b
            args: --shard=4/4
          - mode: shard4-serial
            args: --shard=4/4 --workers=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @labelmod/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @labelmod/web build
      - name: اجرای تشخیصی (${{ matrix.mode }})
        env:
          RESOURCE_LOG: ${{ runner.temp }}/resources.log
          ARGS: ${{ matrix.args }}
        run: eval ".github/scripts/e2e-with-resources.sh pnpm --filter @labelmod/web exec playwright test $ARGS"
      - name: شواهد شکست در لاگ
        if: failure()
        env:
          RESOURCE_LOG: ${{ runner.temp }}/resources.log
        run: |
          python3 .github/scripts/e2e-failure-report.py apps/web/test-results || true
          echo "== resource samples (every 5s)"; cat "$RESOURCE_LOG" || true
          echo "== kernel: OOM / killed / segfault lines"
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process|segfault|webkit' | tail -40 || true
      - name: خلاصهٔ منابع (همیشه)
        if: always()
        env:
          RESOURCE_LOG: ${{ runner.temp }}/resources.log
        run: |
          python3 - "$RESOURCE_LOG" <<'PY'
          import re, sys
          rows = open(sys.argv[1]).read().splitlines()
          print(rows[0] if rows else "no samples")
          avail = [int(m.group(1)) for r in rows if (m := re.search(r"availMB=(\d+)", r))]
          load = [float(m.group(1)) for r in rows if (m := re.search(r"load=([\d.]+)", r))]
          web = [int(m.group(1)) for r in rows if (m := re.search(r"webkitWeb=(\d+)", r))]
          if avail: print(f"samples={len(avail)} minAvailMB={min(avail)} maxLoad1={max(load)} maxWebKitWebProcess={max(web)}")
          PY
      - name: گزارش و trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-${{ matrix.mode }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
