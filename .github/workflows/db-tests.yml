# تست‌های مالی — روی هر Push و هر PR اجرا می‌شوند.
#
# اکشن‌ها به SHA کامل کامیت پین شده‌اند، نه به تگ (بند ۵ SECURITY.md).
# تگ قابل جابه‌جایی است: کسی که مخزن اکشن را در اختیار بگیرد می‌تواند
# v4 را به کامیت دیگری منتقل کند و کد دلخواهش در CI شما اجرا شود.
#
# برای به‌روزرسانی یک پین:
#   git ls-remote https://github.com/actions/checkout refs/tags/v4
# SHA را جایگزین کنید و شماره نسخه را در کامنت کنارش به‌روز کنید.

name: تست‌ها

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # حداقل دسترسی ممکن

jobs:
  db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labelmod
          POSTGRES_USER: labelmod
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labelmod -d labelmod"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://labelmod:ci_only_not_a_real_secret@localhost:5432/labelmod
      PGHOST: localhost
      PGUSER: labelmod
      PGPASSWORD: ci_only_not_a_real_secret
      PGDATABASE: labelmod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: نصب کلاینت پستگرس
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: اجرای مهاجرت‌ها و بارگذاری داده مرجع
        run: ./ops/db.sh migrate && ./ops/db.sh seed

      # db.sh test خودش یک دیتابیس یک‌بارمصرف می‌سازد و در پایان پاک می‌کند
      - name: تست‌های مالی — سناریوی طلایی، حالت لبه‌ای، همزمانی
        run: ./ops/db.sh test

      - name: ادعاهای پایدار — هیچ سند نامتوازن، هیچ موجودی منفی
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "
            DO \$\$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM (
                SELECT entry_id FROM ledger.journal_line
                 GROUP BY entry_id HAVING sum(debit) <> sum(credit)) x;
              IF n > 0 THEN RAISE EXCEPTION 'سند نامتوازن یافت شد: %', n; END IF;

              SELECT count(*) INTO n FROM inventory.stock_balance WHERE on_hand < 0;
              IF n > 0 THEN RAISE EXCEPTION 'موجودی منفی یافت شد: %', n; END IF;

              SELECT count(*) INTO n FROM inventory.balance_check
               WHERE qty_diff <> 0 OR value_diff <> 0;
              IF n > 0 THEN RAISE EXCEPTION 'اختلاف Projection با حرکت‌ها: %', n; END IF;

              -- هر فاکتور نهایی‌شده باید در یک دوره ثبتِ بسته‌شده باشد
              SELECT count(*) INTO n FROM sales.unposted_revenue;
              IF n > 0 THEN RAISE EXCEPTION 'درآمد ثبت‌نشده در دفتر: % فاکتور', n; END IF;

              -- دفتر حسابرسی نباید دست‌کاری شده باشد — **پیوند و محتوا**.
              -- ⚠️ نسخه قبلی فقط prev_hash = lag(hash) را می‌سنجید، یعنی
              -- فقط پیوندها؛ تغییر محتوای یک سطر بی‌صدا رد می‌شد.
              -- مهاجرت ۰۵۱ بازمحاسبه را آورد. db/test/audit-chain.sql
              -- اثبات می‌کند آشکارساز واقعاً می‌گیرد.
              SELECT count(*) INTO n FROM platform.audit_check;
              IF n > 0 THEN
                RAISE EXCEPTION 'دست‌کاری در دفتر حسابرسی: % سطر (%)', n,
                  (SELECT string_agg(DISTINCT problem, ', ') FROM platform.audit_check);
              END IF;

              -- هیچ مؤلفه درآمدی، مالیاتی یا انبار نباید اجازه تغییر حساب بگیرد
              SELECT count(*) INTO n FROM ledger.posting_rule
               WHERE allow_account_override
                 AND account_code IN ('4101','4102','4103','4201','2201','5101','5102','1301');
              IF n > 0 THEN
                RAISE EXCEPTION 'مؤلفه قفل‌شده با اجازه تغییر حساب: %', n;
              END IF;

              -- مشتری و تأمین‌کننده جدول دارند، پس سطرشان باید شناسه داشته
              -- باشد؛ وگرنه گردش حساب اشخاص از دفتر ساختنی نیست.
              -- (party_type='other' مثل باربری جدول ندارد و مستثناست.)
              SELECT count(*) INTO n FROM ledger.journal_line
               WHERE party_type IN ('customer','supplier') AND party_id IS NULL;
              IF n > 0 THEN
                RAISE EXCEPTION 'سطر سند با نوع شخص ولی بدون شناسه شخص: %', n;
              END IF;

              -- و «داشتن شناسه» با «درست بودن» یکی نیست: party_id عمداً
              -- FK ندارد (چندریختی است) پس تا مهاجرت ۰۵۲ هیچ‌چیز نمی‌سنجید
              -- که آن شناسه واقعاً کسی باشد. یک مانده در گردش اشخاص با
              -- نام NULL، که از هیچ‌کس وصول نمی‌شود.
              SELECT count(*) INTO n FROM ledger.party_check;
              IF n > 0 THEN
                RAISE EXCEPTION 'سطر سند با شناسه شخصی که وجود ندارد: % سطر (%)', n,
                  (SELECT string_agg(DISTINCT problem, ', ') FROM ledger.party_check);
              END IF;

              -- ارزش موجودی در دفتر باید با ارزش واقعی انبار بخواند.
              -- ⚠️ balance_check این را **نمی‌سنجد**: آن stock_balance را با
              -- stock_movement مقایسه می‌کند — هر دو درون ماژول انبار. تا
              -- مهاجرت ۰۴۹ هیچ ثابتی دفتر را با انبار تطبیق نمی‌داد، و سند
              -- افتتاحیهٔ ناقص دقیقاً از همین شکاف رد شد.
              SELECT count(*) INTO n FROM inventory.ledger_check WHERE diff <> 0;
              IF n > 0 THEN
                RAISE EXCEPTION 'واگرایی دفتر با ارزش واقعی انبار: %',
                  (SELECT diff FROM inventory.ledger_check);
              END IF;

              -- مانده حساب‌های چک در دفتر باید با جمع برگه‌های باز بخواند.
              SELECT count(*) INTO n FROM treasury.cheque_check WHERE diff <> 0;
              IF n > 0 THEN
                RAISE EXCEPTION 'اختلاف دفتر با پرونده چک: % حساب', n;
              END IF;

              -- وضعیت چک Projection زنجیره رویداد است، نه یک ستون آزاد
              SELECT count(*) INTO n FROM treasury.cheque c
               WHERE c.status <> 'draft'
                 AND NOT EXISTS (SELECT 1 FROM treasury.cheque_event e
                                  WHERE e.cheque_id = c.id);
              IF n > 0 THEN
                RAISE EXCEPTION 'چک با وضعیت غیر draft و بدون رویداد: %', n;
              END IF;

              -- خودِ توکن نشست هرگز ذخیره نمی‌شود؛ فقط SHA-256 آن
              SELECT count(*) INTO n FROM identity.session
               WHERE token_hash !~ '^[0-9a-f]{64}$';
              IF n > 0 THEN
                RAISE EXCEPTION 'نشست با هش توکن نامعتبر: %', n;
              END IF;

              -- دستگاه تأییدشده باید تأییدکننده و زمان تأیید داشته باشد
              SELECT count(*) INTO n FROM identity.device
               WHERE is_approved AND (approved_by IS NULL OR approved_at IS NULL);
              IF n > 0 THEN
                RAISE EXCEPTION 'دستگاه تأییدشده بدون تأییدکننده: %', n;
              END IF;

              -- راز دستگاه فقط روی دستگاه تأییدشده معنا دارد
              SELECT count(*) INTO n FROM identity.device
               WHERE secret_hash IS NOT NULL AND NOT is_approved;
              IF n > 0 THEN
                RAISE EXCEPTION 'دستگاه ثبت‌نام‌شده ولی تأییدنشده: %', n;
              END IF;

              -- نشستِ باز‌شده با PIN نباید باطل یا منقضی باشد و همچنان
              -- pin_unlocked نگه دارد — یعنی حالت گمراه‌کننده نماند
              SELECT count(*) INTO n FROM identity.session
               WHERE pin_unlocked AND revoked_at IS NOT NULL;
              IF n > 0 THEN
                RAISE EXCEPTION 'نشست باطل‌شده با پرچم PIN: %', n;
              END IF;

              -- سطر فاکتور بدون قیمت یعنی جایی قیمت را از کلاینت گرفته
              SELECT count(*) INTO n FROM sales.invoice_line l
                JOIN sales.invoice i ON i.id = l.invoice_id
               WHERE i.status <> 'cancelled' AND l.unit_price <= 0;
              IF n > 0 THEN
                RAISE EXCEPTION 'سطر فاکتور با قیمت صفر یا منفی: %', n;
              END IF;

              -- تخفیف سطر هرگز از خودِ سطر بیشتر نمی‌شود
              SELECT count(*) INTO n FROM sales.invoice_line
               WHERE discount_amount > round(qty * unit_price);
              IF n > 0 THEN
                RAISE EXCEPTION 'تخفیف بیشتر از مبلغ سطر: %', n;
              END IF;

              -- جمع فاکتور باید با جمع سطرهایش بخواند
              SELECT count(*) INTO n FROM (
                SELECT i.id FROM sales.invoice i
                  JOIN sales.invoice_line l ON l.invoice_id = i.id
                 WHERE i.status <> 'cancelled'
                 GROUP BY i.id, i.gross_amount, i.net_amount
                HAVING i.gross_amount <> round(sum(l.qty * l.unit_price))
                    OR i.net_amount   <> sum(l.net_amount)) x;
              IF n > 0 THEN
                RAISE EXCEPTION 'جمع فاکتور با جمع سطرهایش نمی‌خواند: %', n;
              END IF;

              -- هیچ عملیات حساسی نباید از فهرست ممنوعه PIN بیرون بماند.
              -- settings.security اینجاست تا دفاع، خودش را هم بپوشاند:
              -- بدون آن، نشستی که با PIN باز شده می‌توانست سیاست PIN را
              -- عوض کند.
              SELECT count(*) INTO n FROM (
                SELECT unnest(ARRAY['refund.cash','invoice.cancel',
                                    'price.change','stock.adjust',
                                    'settings.security']) AS op) x
               WHERE NOT EXISTS (
                 SELECT 1 FROM platform.setting
                  WHERE key = 'auth.pin_forbidden_operations' AND value ? x.op);
              IF n > 0 THEN
                RAISE EXCEPTION 'عملیات حساس خارج از فهرست ممنوعه PIN: %', n;
              END IF;
            END \$\$;"

      # ------------------------------------------------------------------
      # لایه API
      # ------------------------------------------------------------------
      # اکشن‌ها فقط از خود GitHub‌اند (بند ۹ SECURITY.md) و به SHA کامل
      # پین شده‌اند. corepack نسخه pnpm را از packageManager می‌خواند، پس
      # نسخه ابزار هم مثل وابستگی‌ها قفل است.
      - name: راه‌اندازی Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: فعال‌کردن pnpm از packageManager
        run: corepack enable

      - name: نصب وابستگی‌ها
        # --frozen-lockfile الزام بند ۵ SECURITY.md است: نصب در CI نباید
        # بتواند نسخه‌ای بیرون از Lockfile بیاورد.
        run: pnpm install --frozen-lockfile

      - name: Lint
        # ⚠️ تا امروز `pnpm lint` یک no-op بود: `pnpm -r --if-present lint`
        #    روی مخزنی که هیچ اسکریپت `lint` ندارد بی‌صدا **صفر**
        #    برمی‌گرداند. یعنی CI سبز می‌شد بی‌آنکه چیزی Lint شده باشد.
        run: pnpm lint

      - name: بررسی تایپ
        run: pnpm typecheck

      - name: تست‌های لایه API و پالت رابط کاربری
        # تست یکپارچه خودش یک دیتابیس یک‌بارمصرف می‌سازد و می‌اندازد
        run: pnpm test

      # ساخت واقعی رابط کاربری. تایپ‌چک تنها کافی نیست: خطای CSS یا
      # واردکردن نادرست فقط سر Bundle معلوم می‌شود.
      - name: ساخت رابط کاربری
        run: pnpm --filter @labelmod/web build

      - name: آسیب‌پذیری وابستگی‌ها
        # شکست روی High و بالاتر — بند ۵ SECURITY.md
        run: pnpm audit --prod --audit-level high

  # --------------------------------------------------------------------
  # افزونه ووکامرس — نحو PHP و منطقی که اشتباهش بی‌صداست
  # --------------------------------------------------------------------
  # چرا یک Job جدا: نه دیتابیس می‌خواهد نه Node، پس موازی اجرا می‌شود.
  #
  # چرا اصلاً: تبدیل تومان به ریال در همین افزونه است. یک ضربدر ۱۰ که
  # جا بیفتد، همه مبالغ یک صفر کم می‌گیرند و **هیچ خطایی رخ نمی‌دهد** —
  # فقط دفتر یک‌دهم فروش را نشان می‌دهد. با «افزونه فعال شد و خطا نداد»
  # هرگز معلوم نمی‌شود.
  #
  # PHP روی Runner از پیش هست، پس اکشن تازه‌ای لازم نیست (بند ۹
  # SECURITY.md: فهرست مجاز فقط اکشن‌های خود GitHub).
  woocommerce-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: نحو PHP
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" || fail=1
          done < <(find integrations/woocommerce -name '*.php' -print)
          exit $fail

      - name: منطق افزونه — واحد پول، قیمت واحد، نگاشت درگاه
        run: php integrations/woocommerce/test/payload-test.php

      # ⚠️ گیرندهٔ Push تنها مسیری است که از بیرون **به داخل** سایت
      #    می‌نویسد: امضا، پنجرهٔ زمانی، Nonce و نگهبان ترتیب. هر چهار
      #    بی‌صدا می‌شکنند — «افزونه فعال شد و خطا نداد» هیچ‌کدام را
      #    نمی‌گیرد.
      - name: گیرندهٔ ارسال لحظه‌ای — امضا، Replay، ترتیب، صفر و null
        run: php integrations/woocommerce/test/push-receiver-test.php

  # --------------------------------------------------------------------
  # استقرار — ایمیج‌ها واقعاً ساخته می‌شوند و Caddyfile واقعاً سنجیده
  # --------------------------------------------------------------------
  # چرا یک Job جدا: به دیتابیس نیازی ندارد و می‌تواند موازی اجرا شود.
  # چرا اصلاً: یک Dockerfile شکسته تا لحظه استقرار روی سرور واقعی پیدا
  # نمی‌شود — یعنی بدترین لحظه ممکن.
  deploy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ساخت ایمیج API
        run: docker build -f apps/api/Dockerfile -t labelmod-api:ci .

      - name: ساخت ایمیج رابط کاربری
        run: docker build -f apps/web/Dockerfile -t labelmod-web:ci .

      - name: ساخت ایمیج زمان‌بند
        run: docker build -f ops/deploy/Dockerfile.scheduler -t labelmod-scheduler:ci .

      # ⚠️ `-w /app/apps/api` لازم است، نه تزئین: چیدمان pnpm وابستگی‌ها
      # را در `apps/api/node_modules` می‌گذارد، نه در ریشه. از `/app`،
      # `argon2` اصلاً پیدا نمی‌شود.
      - name: argon2 داخل ایمیج روی musl کار می‌کند
        # همان تابعی که رمز پرسنل را هش می‌کند، نه یک فراخوان دلخواه.
        # تایپ‌چک هرگز نمی‌گوید ماژول بومی روی musl لینک می‌شود یا نه.
        run: |
          docker run --rm -w /app/apps/api labelmod-api:ci \
            node --experimental-strip-types --input-type=module -e "
              const { hashSecret, verifySecret } = await import('./src/auth/password.ts');
              const h = await hashSecret('رمز-آزمایشی');
              if (!(await verifySecret(h, 'رمز-آزمایشی'))) throw new Error('argon2 کار نمی‌کند');
              console.log('argon2 ✓');
            "

      - name: نقطه ورود واقعاً اجرا می‌شود و پیکربندی ناقص را می‌شکند
        # سرویسی که با پیکربندی ناقص بالا بیاید و سر اولین درخواست
        # واقعی خطا بدهد، خرابیِ گران‌تری می‌سازد (lib/config.ts).
        # این گام هم آن نگهبان را می‌سنجد و هم اینکه ورودی ایمیج
        # اصلاً اجرا می‌شود.
        run: |
          if docker run --rm labelmod-api:ci > out.txt 2>&1; then
            echo "✗ API بدون DATABASE_URL بالا آمد — نگهبان پیکربندی کار نمی‌کند"; cat out.txt; exit 1
          fi
          grep -q 'پیکربندی نامعتبر است' out.txt || { echo "✗ پیام خطای انتظاری نیامد"; cat out.txt; exit 1; }
          grep -q 'DATABASE_URL' out.txt || { echo "✗ نام متغیر غایب در پیام نیست"; cat out.txt; exit 1; }
          echo "نگهبان پیکربندی ✓"

      - name: Caddyfile معتبر است
        run: |
          docker run --rm \
            -v "$PWD/ops/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS=shop.example.com -e ACME_EMAIL=ci@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: docker-compose تولیدی معتبر است
        run: |
          DB_PASSWORD=ci SITE_ADDRESS=shop.example.com ACME_EMAIL=ci@example.com \
            docker compose -f docker-compose.prod.yml config --quiet
